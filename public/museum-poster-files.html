<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Museum Poster Files</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f9f7f9;
        color: #111;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }
      h1 {
        margin-bottom: 8px;
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      a.button {
        display: inline-block;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid #d1d5db;
        text-decoration: none;
        color: #111;
        background: #fff;
      }
      .grid {
        display: grid;
        gap: 20px;
      }
      @media (min-width: 960px) {
        .grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      .panel {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 12px;
      }
      object {
        width: 100%;
        height: 70vh;
        border: 0;
        border-radius: 10px;
      }
      p.small {
        font-size: 14px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Issey Miyake Museum Poster Files</h1>
      <p class="small">View both PDF versions below.</p>

      <div class="actions">
        <a class="button" href="/museum-poster-ipad.pdf" target="_blank" rel="noopener noreferrer">Open Apple iPad Retina PDF</a>
        <a class="button" href="/museum-poster-screen.pdf" target="_blank" rel="noopener noreferrer">Open Screen Version PDF</a>
      </div>

      <section class="grid">
        <div class="panel">
          <h2>Apple iPad Retina</h2>
          <object data="/museum-poster-ipad.pdf" type="application/pdf">
            <a href="/museum-poster-ipad.pdf" target="_blank" rel="noopener noreferrer">Open PDF</a>
          </object>
        </div>

        <div class="panel">
          <h2>Screen Version</h2>
          <object data="/museum-poster-screen.pdf" type="application/pdf">
            <a href="/museum-poster-screen.pdf" target="_blank" rel="noopener noreferrer">Open PDF</a>
          </object>
        </div>
      </section>
    </main>
  </body>
</html>
